<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabs Ultramart - Black Friday Countdown</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="logo-section">
            <h2 class="brand-name">GABS ULTRAMART</h2>
            <p class="brand-tagline">Your Ultimate Shopping Destination</p>
        </div>

        <h1><span class="black">BLACK</span> <span class="friday">FRIDAY</span></h1>
        <p class="subtitle">⚡ Massive Discounts Coming Soon! ⚡</p>
        
        <div class="countdown">
            <div class="time-unit">
                <span class="time-value" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <p class="message" id="message">🎁 Get Ready for Unbeatable Offers! 🎁</p>

        <div class="deals-info">
            Up to 70% OFF on Selected Items | Exclusive Online Deals
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
